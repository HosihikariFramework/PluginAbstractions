name: template-verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: Plugin.Abstractions

      # 打包器以 NuGet 包 Hosihikari.Plugin.Build 交付；核心仓只在本地发版时用来打这个包。
      - uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginManager
          # 配对的核心 PR 分支：模板用的 Build 包还没发布，先按分支取。
          ref: feat/manifest-rules
          path: PluginManager

      - uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/DotNetCorePlugins
          path: DotNetCorePlugins

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 模板引用本仓的契约版本；本地打包并加为源，发布前的版本也能验证。
      - name: 打包契约与模板
        run: |
          set -euo pipefail
          dotnet pack Plugin.Abstractions/src/Hosihikari.Plugin.Abstractions.csproj -c Release -o artifacts
          dotnet pack PluginManager/tools/Build/Hosihikari.Plugin.Build.csproj -c Release -o artifacts
          dotnet pack Plugin.Abstractions/templates/Hosihikari.Plugin.Templates/Hosihikari.Plugin.Templates.csproj -c Release -o artifacts
          dotnet nuget add source "$PWD/artifacts" -n local

      - name: 检查模板包许可
        run: |
          set -euo pipefail
          unzip -p artifacts/Hosihikari.Plugin.Templates.*.nupkg Hosihikari.Plugin.Templates.nuspec | grep -q 'MIT-0'

      - name: 生成并构建插件
        run: |
          set -euo pipefail
          dotnet new install artifacts/Hosihikari.Plugin.Templates.*.nupkg
          dotnet new hosihikari-plugin -n HelloTemplate -o "$RUNNER_TEMP/HelloTemplate"
          dotnet new hosihikari-plugin-fsharp -n HelloFSharp -o "$RUNNER_TEMP/HelloFSharp"
          test -f "$RUNNER_TEMP/HelloTemplate/LICENSE.md"
          test -f "$RUNNER_TEMP/HelloFSharp/LICENSE.md"
          dotnet build "$RUNNER_TEMP/HelloTemplate/HelloTemplate.csproj" -c Release
          dotnet build "$RUNNER_TEMP/HelloFSharp/HelloFSharp.fsproj" -c Release

      - name: 打插件包
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/HelloTemplate"
          bash ./pack.sh
          test -f dist/HelloTemplate/HelloTemplate.dll
          test -f dist/HelloTemplate/manifest.json
          grep -q '"hosihikari"' dist/HelloTemplate/manifest.json
          if find dist/HelloTemplate -name 'Hosihikari.Plugin.Abstractions.dll' | grep -q .; then
            echo 'the shared contract leaked into the C# plugin package' >&2
            exit 1
          fi
          cd "$RUNNER_TEMP/HelloFSharp"
          bash ./pack.sh
          test -f dist/HelloFSharp/HelloFSharp.dll
          test -f dist/HelloFSharp/manifest.json
          if find dist/HelloFSharp -name 'Hosihikari.Plugin.Abstractions.dll' | grep -q .; then
            echo 'the shared contract leaked into the F# plugin package' >&2
            exit 1
          fi

      - name: 清理模板
        if: always()
        run: dotnet new uninstall Hosihikari.Plugin.Templates || true
