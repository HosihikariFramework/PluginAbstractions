name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: 格式
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 仓里的配置文件与 FormatterConfig 逐字节相同，是标准；漂了就停下并打印 diff。
      - name: 空白
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files)
          fail=0
          for f in "${files[@]}"; do
            [ -s "$f" ] || continue
            if [ -n "$(tail -c 1 "$f")" ]; then
              echo "$f: 文件末尾缺换行"; fail=1
            fi
            if sed 's/\r$//' "$f" | grep -qE '[[:space:]]+$'; then
              echo "$f: 有行尾空白"; fail=1
            fi
          done
          exit "$fail"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # .editorconfig 里的 csharp_* 规则只有 dotnet format 会执行。只放 whitespace：
      # style 那套会连 file_header_template 一起要求。
      - name: C# 空白
        run: |
          set -euo pipefail
          sln=$(git ls-files -- '*.slnx' '*.sln' | head -n 1)
          if [ -z "$sln" ]; then echo "没有解决方案文件"; exit 0; fi
          dotnet format whitespace "$sln" --verify-no-changes
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: 构建
        run: |
          dotnet build model/Hosihikari.Plugin.Models.csproj -c Release
          dotnet build src/Hosihikari.Plugin.Abstractions.csproj -c Release
