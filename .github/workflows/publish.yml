name: publish

on:
  push:
    tags: ['v*', 'template-v*']
  workflow_dispatch:

jobs:
  nuget:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # 换 OIDC 令牌（Trusted Publishing）

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 版本号的事实源是 csproj 里的 <Version>，标签只是触发器。
      # 模型包与契约同版本发布：契约的 nuspec 依赖它，缺了契约包还原不出来。
      - name: 打包
        run: |
          dotnet pack model/Hosihikari.Plugin.Model.csproj -c Release -o out
          dotnet pack src/Hosihikari.Plugin.Abstractions.csproj -c Release -o out

      # 用 OIDC 令牌换一把临时 API key —— 仓库里不存任何长期密钥。
      # 换来的 key 只有一小时有效期、且一个令牌只能换一把，所以这一步紧贴推送。
      - name: 换临时 API key
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org 的用户名（profile name），不是邮箱。
          user: ${{ secrets.NUGET_USER }}

      - name: 推送
        run: >
          dotnet nuget push out/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # 模板包与契约包各有各的版本节奏：契约走 v*，模板走 template-v*。
  # 两者共用 publish.yml，因为 NuGet Trusted Publishing 策略按工作流文件匹配。
  template:
    if: startsWith(github.ref, 'refs/tags/template-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # 换 OIDC 令牌（Trusted Publishing）

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 版本一致
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^template-v', ''
          $version = dotnet msbuild templates/Hosihikari.Plugin.Templates/Hosihikari.Plugin.Templates.csproj -getProperty:PackageVersion
          if ($version -ne $tag) { throw "PackageVersion 是 $version，标签是 $tag" }

      - name: 打包
        run: >
          dotnet pack
          templates/Hosihikari.Plugin.Templates/Hosihikari.Plugin.Templates.csproj
          -c Release -o out

      # 换来的 key 只有一小时有效期、且一个令牌只能换一把，所以这一步紧贴推送。
      - name: 换临时 API key
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: 推送
        run: >
          dotnet nuget push out/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
